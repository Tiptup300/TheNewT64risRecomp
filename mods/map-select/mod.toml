# Song / Music-Track Selector.
# NOTE: this mod dir is historically named "map-select", but RE confirmed its
# target (0x8011E4F8 = g_currentSong) is the SONG index, not the map. It forces
# the music track. The real map/background global is still unidentified (TODO).
[manifest]
id = "tnt_map_select"
version = "1.1.0"
display_name = "Music Track Selector"
description = """
Forces the game to play a chosen music track instead of picking one randomly. \
Set "Song" to Random for normal behavior, or pick a specific track to hear it. \
(Historically shipped as a "map selector" — the forced byte was RE-confirmed to be \
the song index, not the background. There is no discrete map global: the 3D \
background is procedurally generated each game, so a map selector isn't possible.)"""
short_description = "Choose which music track the game plays."
authors = [ "TntRecomp" ]
game_id = "tnt"
minimum_recomp_version = "1.0.0"
enabled_by_default = false

[[manifest.config_options]]
id = "song"
name = "Song"
description = "Which music track to force (Random = normal)."
type = "Enum"
options = [ "Random", "Track 0", "Track 1", "Track 2", "Track 3", "Track 4", "Track 5", "Track 6", "Track 7" ]
default = "Random"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "tnt_map_select"
func_reference_syms_file = "../../tnt.syms.toml"
data_reference_syms_files = [ "../../tnt.datasyms.toml" ]
additional_files = [ ]
